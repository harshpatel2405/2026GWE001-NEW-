<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
        <h3>Ordered List</h3>
    </center>

    <!-- * default is 1 -->
    <ol type="1">
        <li>First</li>
        <li>Second</li>
        <li>Third</li>
    </ol>

    <ol type='a'>
        <li>First</li>
        <li>Second</li>
        <li>Third</li>
    </ol>

    <ol type="A" start="6">
        <li>First</li>
        <li>Second</li>
        <li>Third</li>
    </ol>

    <ol type="i" reversed start="11">
        <li>First</li>
        <li>Second</li>
        <li>Third</li>
    </ol>

    <ol type="I" reversed>
        <li>First</li>
        <li value="11">Second</li>
        <li>Third</li>
    </ol>

        </li>
    </ol>
</body>
</html>
