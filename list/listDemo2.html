<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
        <h3>Unordered List</h3>
    </center>

    <ul>
        <li>Apple</li>
        <li>Mango</li>
        <li>Banana</li>
    </ul>

    <ul type="circle">
        <li>Apple</li>
        <li>Mango</li>
        <li>Banana</li>
    </ul>

    <ul type="square">
        <li>Apple</li>
        <li>Mango</li>
        <li>Banana</li>
    </ul>

    <ul type="none">
        <li>Apple</li>
        <li>Mango</li>
        <li>Banana</li>
    </ul>
</body>
</html>
