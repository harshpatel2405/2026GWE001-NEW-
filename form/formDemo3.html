<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <table border="1" width="50%" height="500px">
            <tr>
                <td>
                    <label for="uname">Username</label>
                </td>
                <td>
                    <input type="text" id="uname" name="uname" placeholder="Enter name">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="pwd">Password</label>
                </td>
                <td>
                    <input type="password" id="pwd" name="pwd" placeholder="Enter password">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="coe">City Of Employment</label>
                </td>
                <td>
                    <input type="text" id="coe" name="coe" placeholder="Enter city">
                </td>
            </tr>
            <tr>
                <td>
                    <label>Web Server</label>
                </td>
                <td>
                    <select>
                        <option>Select a server</option>
                        <option>HTTP Web Server</option>
                        <option>Apache Web Server</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label>Please Specify your role</label>
                </td>
                <td>
                    <input type="radio" name="role">Admin<br>
                    <input type="radio" name="role">Enginner<br>
                    <input type="radio" name="role">Manager<br>
                    <input type="radio" name="role">Guest
                </td>
            </tr>
            <tr>
                <td>
                    <label>Single Sign on to the following</label>
                </td>
                <td>
                    <input type="checkbox" name="role">Mail<br>
                    <input type="checkbox" name="role">payroll<br>
                    <input type="checkbox" name="role">Self-service<br>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <input type="submit" value="Login">

                </td>
                <td> <input type="reset" value="Reset"></td>
            </tr>
        </table>
    </form>
</body>

</html>
