<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- <form action="../index.html" method="get"> -->
    <form>
        <label for="uname">Enter Your name : </label>
        <input type="text" placeholder="enter the name here" id="uname" name="username">

        <br>
        <label for="marks">Enter Marks : </label>
        <input type="number" placeholder="Enter marks" id="marks" name="marks">

        <br>
        <label>Select Your Gender : </label>
        <input type="radio" name="gender" value="male">Male
        <input type="radio" name="gender" value="female">Female

        <br>
        <label>Select Favourite Sports : </label>
        <input type="checkbox" name="sports" value="football">Football
        <input type="checkbox" name="sports" value="cricket">Cricket
        <input type="checkbox" name="sports" value="volleyball">Volleyball
        <input type="checkbox" name="sports" value="badminton">Badminton
        <br>

        <label for="email">Enter Email : </label>
        <input type="email" placeholder="Enter email" id="email" name="email">
        <br>

        <label for="password">Enter password : </label>
        <input type="password" placeholder="Enter password" id="password" name="password">
        <br>
        <input type="submit">
    </form>
</body>

</html>
