<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Table tag (rowspan and colspan)</h1>


    <table border="1" width="500px" height="150px" align="center">
        <tr>
            <th>Id</th>
            <th colspan="2">Blood</th>
            <th>Eligible</th>
        </tr>
        <tr>
            <td>1</td>
            <td>150</td>
            <td>120</td>
            <td>Yes</td>
        </tr>
        <tr>
            <td>2</td>
            <td>150</td>
            <td>120</td>
            <td>Yes</td>
        </tr>


    </table>
    <br>
    <br>
    <br>

    <table border="1" width="500px" height="150px" align="center">
        <tr>
            <th>Id</th>
            <th colspan="2">Blood</th>
            <th>Eligible</th>
        </tr>
        <tr>
            <td rowspan="2">1</td>
            <td>150</td>
            <td>120</td>
            <td rowspan="2">Yes</td>
        </tr>
        <tr>
            <td>170</td>
            <td>140</td>

        </tr>

    </table>


</body>

</html>
