<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Table tag (align , bgcolor, width , height)</h1>

    <table border="1" align="center" bgcolor="blue" width="500px" height="200px">
        <thead>
            <tr bgcolor="green">
                <th>ID</th>
                <th>Name</th>
                <th bgcolor="yellow">Age</th>
                <th>Address</th>
            </tr>
        </thead>
        <tbody>
            <tr align="right">
                <td>1</td>
                <td align="center">Aarav</td>
                <td>12</td>
                <td>XYZ Road</td>
            </tr>
            <tr height="10px">

                <td>2</td>
                <td>Balraj Ghai</td>
                <td width="300px" height="40px">44</td>
                <td>ABC Road, Thana</td>
            </tr>
            <tr align="center">
                <td>3</td>
                <td>Samay Raina</td>
                <td>34</td>
                <td>PQR Road</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
